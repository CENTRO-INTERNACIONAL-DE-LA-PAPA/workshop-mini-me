<script>
// Termina el dibujo del ciclo una vez que la slide está en pantalla:
//  - pone la punta a cada path.flecha (y en ambos extremos si es .doble);
//  - ajusta el fondo de cada etiqueta "Mini-Me · ..." al ancho de su texto.
// Se hace al mostrar la slide porque el SVG no se puede medir mientras está oculto.
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const LARGO = 15;
  const APERTURA = 0.45;

  function punta(path, desde, hacia) {
    const P = path.getPointAtLength(desde);
    const Q = path.getPointAtLength(hacia);
    const ang = Math.atan2(P.y - Q.y, P.x - Q.x);
    const a = [P.x - LARGO * Math.cos(ang - APERTURA), P.y - LARGO * Math.sin(ang - APERTURA)];
    const b = [P.x - LARGO * Math.cos(ang + APERTURA), P.y - LARGO * Math.sin(ang + APERTURA)];
    const h = document.createElementNS(NS, "path");
    h.setAttribute("d", `M ${a[0]} ${a[1]} L ${P.x} ${P.y} L ${b[0]} ${b[1]}`);
    h.setAttribute("class", "punta");
    path.after(h);
  }

  function preparar(slide) {
    if (!slide || slide.dataset.bocetoListo) return;
    const flechas = slide.querySelectorAll("path.flecha");
    if (!flechas.length && !slide.querySelector("g.etiqueta")) return;

    flechas.forEach((p) => {
      const L = p.getTotalLength();
      if (!L) return;
      punta(p, L, L - LARGO);
      if (p.classList.contains("doble")) punta(p, 0, LARGO);
    });

    slide.querySelectorAll("g.etiqueta").forEach((g) => {
      const t = g.querySelector("text");
      const r = g.querySelector("rect");
      const b = t.getBBox();
      r.setAttribute("x", b.x - 13);
      r.setAttribute("y", b.y - 4);
      r.setAttribute("width", b.width + 26);
      r.setAttribute("height", b.height + 8);
      r.setAttribute("rx", 15);
    });

    slide.dataset.bocetoListo = "1";
  }

  function alMostrar() {
    document.fonts.ready.then(() => preparar(Reveal.getCurrentSlide()));
  }

  window.addEventListener("load", () => {
    if (Reveal.isReady()) alMostrar();
    Reveal.on("ready", alMostrar);
    Reveal.on("slidechanged", alMostrar);
  });
})();
</script>
